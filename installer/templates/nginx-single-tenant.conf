# Parako.ID single-tenant nginx vhost (reference)
#
# This file is the canonical reference for the nginx config that the installer
# generates when `--with-nginx` is set (without `--multi-tenant`). The installer
# renders this same content inline; this file exists for:
#   - Audit visibility (operators can review the template alongside install.sh)
#   - Manual installation: copy to /etc/nginx/sites-available/parako-id and
#     substitute ${DOMAIN} + ${PORT}
#
# Substitutions:
#   ${DOMAIN}  → your public hostname (e.g. auth.example.com)
#   ${PORT}    → Parako.ID upstream port (default 9007)

upstream parako_backend {
    server 127.0.0.1:${PORT};
    keepalive 64;
}

server {
    listen 80;
    server_name ${DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://parako_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    location /css/ {
        proxy_pass http://parako_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /js/ {
        proxy_pass http://parako_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
