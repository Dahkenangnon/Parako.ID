# Parako.ID multi-tenant nginx vhost — EXAMPLE (operator-run)
#
# The Parako.ID installer does NOT render, install, or reload nginx and does
# NOT run certbot. This file is a reference example operators can copy, edit,
# and install themselves.
#
# Prerequisites (operator):
#   1. Wildcard DNS A record:    *.${BASE_DOMAIN}  → <VPS_IP>
#   2. Explicit _ops record:     _ops.${BASE_DOMAIN}       → <VPS_IP>
#   3. Explicit _platforms:      _platforms.${BASE_DOMAIN} → <VPS_IP>
#   4. Wildcard TLS certificate via DNS-01:
#        certbot certonly --dns-<plugin> -d "${BASE_DOMAIN}" -d "*.${BASE_DOMAIN}"
#   5. Install this file at /etc/nginx/sites-available/parako-id-multi-tenant
#   6. ln -s /etc/nginx/sites-available/parako-id-multi-tenant /etc/nginx/sites-enabled/
#   7. nginx -t && systemctl reload nginx
#
# Substitutions:
#   ${BASE_DOMAIN}  → e.g. auth.example.com
#   ${PORT}         → Parako.ID upstream port (default 9007)

upstream parako_backend {
    server 127.0.0.1:${PORT};
    keepalive 64;
}

server {
    listen 80;
    server_name *.${BASE_DOMAIN} _ops.${BASE_DOMAIN} _platforms.${BASE_DOMAIN};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name *.${BASE_DOMAIN} _ops.${BASE_DOMAIN} _platforms.${BASE_DOMAIN};

    ssl_certificate /etc/letsencrypt/live/${BASE_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BASE_DOMAIN}/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://parako_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
