name: CI and Release
run-name: CI and release — ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: {}

permissions:
  contents: read

# Superseded branch and pull-request runs are cancelled. Immutable release-tag
# runs continue so publication cannot be interrupted midway through signing.
concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Enforce the public repository's Conventional Commit policy independently so
  # commit failures are not hidden behind source or test output.
  commit-policy:
    name: Policy — commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pushed commit message
        if: github.event_name != 'pull_request'
        run: pnpm exec commitlint --last --verbose

      - name: Validate every pull-request commit message
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # Keep dependency vulnerabilities and incompatible production licenses visible
  # as their own policy gate.
  dependency-policy:
    name: Policy — dependencies and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies at high severity
        run: pnpm audit --audit-level=high --prod

      - name: Validate production dependency licenses
        run: pnpm run release:licenses

  # Static architecture, lint, and formatting checks are grouped because they
  # inspect source shape without compiling or executing the application.
  source-quality:
    name: Source quality — architecture, lint, and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate architecture boundaries
        run: pnpm run test:architecture

      - name: Run ESLint with zero warnings
        run: pnpm run lint:check

      - name: Check source formatting
        run: pnpm run format:check

  # Every TypeScript project is a distinct matrix run and therefore appears as
  # a separately named check in the GitHub Actions UI.
  typecheck:
    name: Typecheck — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: server
            script: typecheck:server
          - label: browser assets
            script: typecheck:browser
          - label: maintenance scripts
            script: typecheck:scripts
          - label: unit tests
            script: typecheck:test:unit
          - label: integration tests
            script: typecheck:test:integration
          - label: browser E2E tests
            script: typecheck:e2e
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck ${{ matrix.label }}
        run: pnpm run ${{ matrix.script }}

  # Unit behavior runs independently from contracts, integrations, cumulative
  # coverage, and browser E2E so failures identify the affected layer directly.
  unit-tests:
    name: Tests — unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

  # Repository contracts are intentionally independent from unit and adapter
  # tests so a public-interface regression has an unambiguous check.
  contract-tests:
    name: Tests — repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository contract tests
        run: pnpm run test:contract

  # Persistence integration covers repository implementations, migrations,
  # tenancy helpers, and storage providers backed by disposable SQLite and
  # MongoDB fixtures.
  integration-persistence:
    name: Integration — persistence (SQLite and MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # gitleaks:allow -- deterministic non-production test encryption key.
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run persistence integration tests
        run: pnpm run test:integration:persistence

  # OIDC adapter and key-store integration has its own Redis service and check,
  # separate from application routes and operational behavior.
  integration-oidc:
    name: Integration — OIDC adapters and key storage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # gitleaks:allow -- deterministic non-production test encryption key.
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run OIDC integration tests
        run: pnpm run test:integration:oidc

  # Application integration covers configuration propagation, health, routes,
  # CLI processes, security behavior, manifests, and utilities.
  integration-application:
    name: Integration — application runtime and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CONTRACT_MONGODB_URI: mongodb://127.0.0.1:27017/parako_config_integration
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # gitleaks:allow -- deterministic non-production test encryption key.
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production CLI entrypoints
        run: pnpm run build

      - name: Run application integration tests
        run: pnpm run test:integration:application

  # The cumulative coverage policy intentionally remains separate from test
  # diagnostics. It runs the complete suite because Vitest's per-file coverage
  # ratchet depends on the combined execution map.
  coverage:
    name: Coverage — cumulative source policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CONTRACT_MONGODB_URI: mongodb://127.0.0.1:27017/parako_config_integration
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # gitleaks:allow -- deterministic non-production test encryption key.
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the cumulative coverage policy
        run: pnpm run test:coverage

      - name: Upload cumulative coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cumulative-coverage-${{ github.run_id }}
          path: test-results/coverage
          if-no-files-found: warn
          retention-days: 7

  # PostgreSQL owns its generated client, disposable migrated database, tenant
  # RLS coverage, CLI behavior, and Redis-backed configuration invalidation.
  integration-postgresql:
    name: Integration — PostgreSQL, RLS, and configuration invalidation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parako
          POSTGRES_PASSWORD: parako
          POSTGRES_DB: parako_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parako"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # gitleaks:allow -- disposable CI-only PostgreSQL service credentials.
      STORAGE_POSTGRESQL_URL: postgresql://parako:parako@127.0.0.1:5432/parako_test
      # gitleaks:allow -- disposable CI-only PostgreSQL service credentials.
      DATABASE_URL: postgresql://parako:parako@127.0.0.1:5432/parako_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # gitleaks:allow -- deterministic non-production test encryption key.
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production CLI entrypoints
        run: pnpm run build

      - name: Run PostgreSQL integration tests
        run: pnpm run test:integration:postgresql

  # Build separately from static checks and tests. This exposes packaging or
  # manifest failures without burying them in a general-purpose job.
  production-build:
    name: Build — production application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production application
        run: pnpm run build

  # This E2E job verifies that the test harness can provision its application
  # infrastructure instead of depending on a pre-started local deployment.
  e2e-infrastructure:
    name: Browser E2E — self-starting infrastructure
    runs-on: ubuntu-latest
    needs:
      - commit-policy
      - dependency-policy
      - source-quality
      - typecheck
      - unit-tests
      - contract-tests
      - integration-persistence
      - integration-oidc
      - integration-application
      - integration-postgresql
      - coverage
      - production-build
    timeout-minutes: 75
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: parako
          POSTGRES_PASSWORD: parako
          POSTGRES_DB: parako_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parako"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # gitleaks:allow -- disposable CI-only PostgreSQL service credentials.
      PARAKO_E2E_POSTGRESQL_URL: postgresql://parako:parako@127.0.0.1:5432/parako_e2e
      PARAKO_E2E_PROFILE: self-starting
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome and system dependencies
        run: pnpm exec playwright install --with-deps chrome

      - name: Build production application for E2E
        run: pnpm run build

      - name: Run self-starting deployment matrix
        run: pnpm run test:e2e:cell

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-infrastructure-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Each cell/profile pair is an independent browser E2E job in the Actions UI,
  # making adapter, tenancy, and configuration failures directly identifiable.
  e2e-browser-matrix:
    name: Browser E2E — ${{ matrix.cell }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    needs:
      - commit-policy
      - dependency-policy
      - source-quality
      - typecheck
      - unit-tests
      - contract-tests
      - integration-persistence
      - integration-oidc
      - integration-application
      - integration-postgresql
      - coverage
      - production-build
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        cell:
          - sqlite-single
          - mongodb-single
          - mongodb-multi
          - postgresql-single
          - postgresql-multi
        profile:
          - default
          - database-configuration
          - notification-policy
          - phone-verification
          - security-questions
          - sms-recovery
          - social
          - social-policy-max
          - social-policy-restricted
          - background-jobs
          - worker-drain
          - operations
          - webauthn
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: parako
          POSTGRES_PASSWORD: parako
          POSTGRES_DB: parako_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parako"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PARAKO_E2E_CELL: ${{ matrix.cell }}
      PARAKO_E2E_PROFILE: ${{ matrix.profile }}
      # gitleaks:allow -- disposable CI-only PostgreSQL service credentials.
      PARAKO_E2E_POSTGRESQL_URL: postgresql://parako:parako@127.0.0.1:5432/parako_e2e
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm 11.4.0
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome and system dependencies
        run: pnpm exec playwright install --with-deps chrome

      - name: Build production application for E2E
        run: pnpm run build

      - name: Run browser cell and profile
        run: pnpm run test:e2e:cell

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.cell }}-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Release builds are architecture-specific. Publishing happens only after both
  # artifacts pass the same CI and adapter gates.
  release-build:
    name: Release artifact — linux/${{ matrix.arch }}
    needs:
      - commit-policy
      - dependency-policy
      - source-quality
      - typecheck
      - unit-tests
      - contract-tests
      - integration-persistence
      - integration-oidc
      - integration-application
      - integration-postgresql
      - coverage
      - production-build
      - e2e-infrastructure
      - e2e-browser-matrix
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: extract
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$PACKAGE_VERSION" ] || {
            echo "::error::Tag v$VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          }
          grep -q "^## \[$VERSION\] - " CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no $VERSION release section"
            exit 1
          }
          [ "$(git rev-list -n1 "$REF_NAME")" = "$(git rev-parse HEAD)" ] || {
            echo "::error::Release tag does not point to checked-out HEAD"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release artifact
        env:
          V: ${{ steps.extract.outputs.version }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          bash scripts/release.sh "$V" --verbose

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Sign architecture artifact
        env:
          ARCH: ${{ matrix.arch }}
          V: ${{ steps.extract.outputs.version }}
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          for file in "parako-id-v$V-linux-$ARCH.tar.gz" "parako-id-v$V-linux-$ARCH.zip"; do
            test -f "$file" || { echo "::error::missing $file"; exit 1; }
            cosign sign-blob --yes \
              --output-signature "$file.sig" \
              --output-certificate "$file.pem" \
              "$file"
            cosign verify-blob \
              --signature "$file.sig" \
              --certificate "$file.pem" \
              --certificate-identity "https://github.com/Dahkenangnon/Parako.ID/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$file"
          done

      - name: Stage architecture artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            parako-id-v*-linux-${{ matrix.arch }}.tar.gz
            parako-id-v*-linux-${{ matrix.arch }}.tar.gz.sig
            parako-id-v*-linux-${{ matrix.arch }}.tar.gz.pem
            parako-id-v*-linux-${{ matrix.arch }}.zip
            parako-id-v*-linux-${{ matrix.arch }}.zip.sig
            parako-id-v*-linux-${{ matrix.arch }}.zip.pem

  # Build, publish, sign, and verify one immutable multi-platform OCI image.
  container-release:
    name: Release container — signed multi-platform image
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.sign.outputs.reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release image
        id: image
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::Invalid release version: $VERSION"
            exit 1
          }
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          [ "$VERSION" = "$PACKAGE_VERSION" ] || {
            echo "::error::Tag v$VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          }
          IMAGE="ghcr.io/dahkenangnon/parako-id"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.image }}:v${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Sign and verify immutable image digest
        id: sign
        env:
          COSIGN_YES: 'true'
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          REFERENCE="${IMAGE}@${DIGEST}"
          cosign sign --yes "$REFERENCE"
          cosign verify \
            --certificate-identity "https://github.com/Dahkenangnon/Parako.ID/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$REFERENCE"
          echo "reference=$REFERENCE" >> "$GITHUB_OUTPUT"

  # Publish signed archives and integrity metadata only after the container
  # and every architecture-specific artifact have passed their gates.
  release:
    name: Release publication — immutable GitHub release
    needs: [release-build, container-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: extract
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download architecture artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Build combined checksum manifest
        working-directory: release-assets
        run: |
          set -euo pipefail
          cp ../installer/install.sh ./install.sh
          cp ../installer/install-git.sh ./install-git.sh
          shopt -s nullglob
          for ARCH in x64 arm64; do
            ARCHIVES=(parako-id-v*-linux-"$ARCH".tar.gz)
            [ "${#ARCHIVES[@]}" -eq 1 ] || { echo "::error::expected one $ARCH archive"; exit 1; }
            ARCHIVE=${ARCHIVES[0]}
            tar -xOf "$ARCHIVE" parako-id-release/SBOM.spdx.json > "SBOM-linux-$ARCH.spdx.json"
            tar -xOf "$ARCHIVE" parako-id-release/release-manifest.json > "release-manifest-linux-$ARCH.json"
          done
          sha256sum parako-id-v*.tar.gz parako-id-v*.zip \
            install.sh install-git.sh SBOM-linux-*.spdx.json \
            release-manifest-linux-*.json | sort -k2 > SHA256SUMS
          test "$(grep -c 'SBOM-linux-' SHA256SUMS)" -eq 2
          test "$(grep -c 'release-manifest-linux-' SHA256SUMS)" -eq 2
          test "$(grep -c '\.tar\.gz$' SHA256SUMS)" -eq 2
          test "$(grep -c '\.zip$' SHA256SUMS)" -eq 2

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Sign combined checksum manifest
        working-directory: release-assets
        env:
          COSIGN_YES: 'true'
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
          cosign verify-blob \
            --signature SHA256SUMS.sig \
            --certificate SHA256SUMS.pem \
            --certificate-identity "https://github.com/Dahkenangnon/Parako.ID/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            SHA256SUMS
          for installer in install.sh install-git.sh; do
            cosign sign-blob --yes \
              --output-signature "$installer.sig" \
              --output-certificate "$installer.pem" \
              "$installer"
            cosign verify-blob \
              --signature "$installer.sig" \
              --certificate "$installer.pem" \
              --certificate-identity "https://github.com/Dahkenangnon/Parako.ID/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$installer"
          done

      - name: Extract changelog body
        env:
          V: ${{ steps.extract.outputs.version }}
        run: node scripts/extract-changelog.mjs "$V" > RELEASE_BODY.md

      - name: Append installer integrity
        run: |
          set -euo pipefail
          NATIVE_INSTALLER_SHA=$(sha256sum release-assets/install.sh | awk '{print $1}')
          GIT_INSTALLER_SHA=$(sha256sum release-assets/install-git.sh | awk '{print $1}')
          {
            printf '\n## Installer integrity\n\n'
            printf 'Verify the downloaded installer and its Cosign signature before running it.\n\n'
            printf '```\n'
            printf 'Native installer SHA256: %s  install.sh\n' "$NATIVE_INSTALLER_SHA"
            printf 'Git installer SHA256:    %s  install-git.sh\n' "$GIT_INSTALLER_SHA"
            printf '```\n'
          } >> RELEASE_BODY.md

      - name: Append container integrity
        env:
          IMAGE_REFERENCE: ${{ needs.container-release.outputs.image }}
        run: |
          set -euo pipefail
          printf '%s' "$IMAGE_REFERENCE" | grep -qE '^ghcr\.io/dahkenangnon/parako-id@sha256:[a-f0-9]{64}$' || {
            echo "::error::Invalid signed container reference: $IMAGE_REFERENCE"
            exit 1
          }
          {
            printf '\n## Container image\n\n'
            printf 'Signed multi-platform image (linux/amd64 and linux/arm64):\n\n'
            printf '`%s`\n' "$IMAGE_REFERENCE"
          } >> RELEASE_BODY.md

      - name: Enforce immutable tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::Release v$V already exists and is immutable"
            exit 1
          fi
          git rev-parse "refs/tags/v$V" >/dev/null 2>&1 || {
            echo "::error::Tag v$V is required; this workflow never creates tags"
            exit 1
          }
          TAG_COMMIT=$(git rev-list -n1 "v$V")
          HEAD_COMMIT=$(git rev-parse HEAD)
          [ "$TAG_COMMIT" = "$HEAD_COMMIT" ] || {
            echo "::error::Tag v$V points to $TAG_COMMIT, not $HEAD_COMMIT"
            exit 1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.extract.outputs.version }}
          name: v${{ steps.extract.outputs.version }}
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
          files: |
            release-assets/parako-id-v*.tar.gz
            release-assets/parako-id-v*.tar.gz.sig
            release-assets/parako-id-v*.tar.gz.pem
            release-assets/parako-id-v*.zip
            release-assets/parako-id-v*.zip.sig
            release-assets/parako-id-v*.zip.pem
            release-assets/SHA256SUMS
            release-assets/SHA256SUMS.sig
            release-assets/SHA256SUMS.pem
            release-assets/install.sh
            release-assets/install.sh.sig
            release-assets/install.sh.pem
            release-assets/install-git.sh
            release-assets/install-git.sh.sig
            release-assets/install-git.sh.pem
            release-assets/SBOM-linux-*.spdx.json
            release-assets/release-manifest-linux-*.json
