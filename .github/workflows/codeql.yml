name: Security — CodeQL
run-name: CodeQL security analysis — ${{ github.ref_name }}

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'dev']
  # Weekly full analysis complements push and pull-request checks.
  schedule:
    - cron: '20 22 * * 2'
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each language is a separate matrix run with an explicit check name.
  analyze:
    name: CodeQL — ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GitHub Actions
            language: actions
            build-mode: none
          - label: JavaScript and TypeScript
            language: javascript-typescript
            build-mode: none

    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize ${{ matrix.label }} analysis
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Analyze ${{ matrix.label }} and upload results
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
