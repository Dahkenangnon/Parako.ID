name: Auto-tag release commits

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: "startsWith(github.event.head_commit.message, 'chore(release): v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from HEAD commit message
        id: extract
        run: |
          set -euo pipefail
          MSG=$(git log -1 --pretty=%B HEAD)
          VERSION=$(printf '%s' "$MSG" | sed -n 's/^chore(release): v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from HEAD commit subject"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reject if tag already exists
        env:
          V: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::Tag v$V already exists"
            exit 1
          fi

      - name: Create and push annotated tag
        env:
          V: ${{ steps.extract.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a -m "release: v$V" "v$V"
          git push origin "v$V"
