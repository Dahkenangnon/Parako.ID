name: Installer and Operator CI
run-name: Installer and operator CI — ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'deployment/docker/**'
      - '.dockerignore'
      - '.env.example'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prisma/**'
      - 'runtime/locales/**'
      - 'runtime/views/**'
      - 'src/**'
      - 'scripts/build.js'
      - 'scripts/release.sh'
      - '.github/workflows/installer-ci.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'deployment/docker/**'
      - '.dockerignore'
      - '.env.example'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'prisma/**'
      - 'runtime/locales/**'
      - 'runtime/views/**'
      - 'src/**'
      - 'scripts/build.js'
      - 'scripts/release.sh'
      - '.github/workflows/installer-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: installer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shell syntax, portability diagnostics, and static analysis are isolated from
  # behavioral installer tests so failures identify a source-quality concern.
  shell-quality:
    name: Shell quality — syntax and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck and checkbashisms
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck devscripts

      - name: Validate Bash syntax
        run: |
          bash -n installer/install.sh
          bash -n installer/install-git.sh
          bash -n installer/parako.sh
          bash -n installer/parako-docker.sh

      - name: Run ShellCheck with warning-level failures
        run: |
          shellcheck -S warning installer/install.sh
          shellcheck -S warning installer/install-git.sh
          shellcheck -S warning installer/parako.sh
          shellcheck -S warning installer/parako-docker.sh

      - name: Report non-blocking POSIX portability diagnostics
        continue-on-error: true
        run: |
          checkbashisms installer/install.sh || true
          checkbashisms installer/install-git.sh || true
          checkbashisms installer/parako.sh || true
          checkbashisms installer/parako-docker.sh || true

  # The low-level installer has a deliberately narrow contract: it stages
  # verified releases and must never manage packages, services, proxies, or DBs.
  installer-contract:
    name: Installer contract — boundaries and structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Enforce low-level installer responsibility boundaries
        run: |
          set -euo pipefail
          if grep -HnE '(^|[^[:alnum:]_-])(systemctl|pm2|pg_dump|mongodump|certbot|nginx -t)([[:space:]]|$)' \
               installer/install.sh \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
             | grep -vE '\bprintf .*' \
             | grep -vE 'printf [^|]*\((systemctl|pm2|docker)' \
             | grep -vE '"start / stop / restart"' \
             | grep -vE 'NOT (manage|invoke|configure|run|do)' ; then
            echo "::error::installer code contains a banned tool call (above)" >&2
            exit 1
          fi
          if grep -HnE '(apt-get install|yum install|apk add )' \
               installer/install.sh \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
             | grep -vE 'die ' \
             | grep -vE '_pf_(fail|warn|ok)' \
             | grep -vE 'log_(warn|err) ' \
             | grep -vE 'printf .*apk add' ; then
            echo "::error::installer code contains a package-manager install call (above)" >&2
            exit 1
          fi
          if grep -HnE 'pnpm (install|db:)' \
               installer/install.sh \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
             | grep -vE 'printf .*' ; then
            echo "::error::installer code contains pnpm install/db: invocation (above)" >&2
            exit 1
          fi
          echo "installer code is free of banned tool calls"

      - name: Validate installer functions and supported flags
        run: bats installer/test/structure.bats

  # Native operator lifecycle tests cover activation, update, rollback, and
  # cleanup without involving Docker-specific orchestration.
  native-operator-tests:
    name: Operator tests — native lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run native operator lifecycle regression tests
        run: bash installer/test/operator-lifecycle.sh

  # Docker operator behavior and Compose topology syntax are checked separately
  # from expensive image builds and live topology smoke tests.
  docker-operator-tests:
    name: Operator tests — Docker commands and Compose policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Run Docker operator regression tests
        run: bats installer/test/docker-operator.bats

      - name: Validate Docker Compose topology files
        run: bash installer/test/validate-docker-compose.sh

  # Each managed persistence topology builds and boots independently, which
  # makes adapter-specific Docker failures visible in the Actions job list.
  docker-topology-smoke:
    name: Docker smoke — ${{ matrix.adapter }} topology
    runs-on: ubuntu-24.04
    needs: [shell-quality, installer-contract, docker-operator-tests]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        adapter: [sqlite, postgresql, mongodb]
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.adapter }} production image
        env:
          IMAGE: parako-id:ci-${{ matrix.adapter }}
        run: docker build --file deployment/docker/Dockerfile --tag "$IMAGE" .

      - name: Exercise managed ${{ matrix.adapter }} topology
        env:
          ADAPTER: ${{ matrix.adapter }}
          IMAGE: parako-id:ci-${{ matrix.adapter }}
        run: bash installer/test/docker-topology-smoke.sh "$ADAPTER" "$IMAGE"

  # The source distribution path has its own immutable-reference and operator
  # configuration contract, independent of binary release fixtures.
  git-source-tests:
    name: Installer tests — Git source lifecycle
    runs-on: ubuntu-latest
    needs: [shell-quality, installer-contract]
    timeout-minutes: 10
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Run Git installer and operator configuration tests
        run: bats installer/test/git-installer.bats installer/test/operator-config.bats

  # Build one deterministic release fixture after native source checks pass. The
  # artifact is consumed by all operating-system smoke jobs below.
  release-fixture:
    name: Installer fixture — production release archive
    runs-on: ubuntu-latest
    needs: [shell-quality, installer-contract, native-operator-tests]
    timeout-minutes: 20
    outputs:
      fixture_version: ${{ steps.build.outputs.version }}
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable pnpm 11
        run: corepack enable && corepack prepare pnpm@11 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production application
        run: pnpm build

      - name: Build deterministic release fixture
        id: build
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          bash scripts/release.sh "$V" --verbose
          ls -la "parako-id-v${V}-linux-x64.tar.gz" SHA256SUMS
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Upload release fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parako-fixture
          path: |
            parako-id-v*.tar.gz
            SHA256SUMS
          retention-days: 1

  # Fresh-install behavior is exercised in separate OS containers. Matrix names
  # expose distribution-specific failures without combining their logs.
  os-install-smoke:
    name: Installer smoke — ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: release-fixture
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:12
          - debian:13
    container:
      image: ${{ matrix.os }}
    env:
      OS_IMAGE: ${{ matrix.os }}
      FIX_VERSION: ${{ needs.release-fixture.outputs.fixture_version }}
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release fixture
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parako-fixture
          path: ./fixture

      - name: Install operating-system prerequisites
        run: |
          case "$OS_IMAGE" in
            ubuntu:*|debian:*)
              apt-get update -qq
              apt-get install -y -qq bash bats curl ca-certificates openssl tar coreutils util-linux
              ;;
          esac
          bash --version | head -n1
          bats --version
          command -v flock

      - name: Validate installer arguments, plan, and help output
        run: bats installer/test/smoke.bats

      - name: Perform fresh installation from release fixture
        shell: bash
        run: |
          set -euo pipefail
          FIX_TAR="$(pwd)/fixture/parako-id-v${FIX_VERSION}-linux-x64.tar.gz"
          FIX_SUMS="$(pwd)/fixture/SHA256SUMS"
          bash installer/install.sh \
            --dir /opt/parako-id \
            --version "${FIX_VERSION}" \
            --offline \
            --tarball "${FIX_TAR}" \
            --checksum "${FIX_SUMS}" \
            --insecure-no-signature --reason "ci fixture; no signed release exists yet" \
            --non-interactive --force \
            --no-bin
          test -L /opt/parako-id/current
          test -d /opt/parako-id/runtime/locales
          test -d /opt/parako-id/runtime/views
          test ! -f /opt/parako-id/runtime/.env
          test ! -d /opt/parako-id/runtime/jwks
          [[ "$(readlink /opt/parako-id/current)" == /opt/parako-id/releases/* ]]
          [[ "$(readlink "/opt/parako-id/releases/v${FIX_VERSION}/runtime")" == ../../runtime ]]

      - name: Run installer doctor against fresh installation
        run: bash installer/install.sh --doctor --dir /opt/parako-id --no-color

      - name: Preview release garbage collection
        run: bash installer/install.sh --gc --dir /opt/parako-id --keep 1

      - name: Verify install log contains no operator-owned tool calls
        shell: bash
        run: |
          set -euo pipefail
          LOG=$(find /var/log -maxdepth 1 -name 'parako-install-*.log' 2>/dev/null | head -n1)
          if [ -z "${LOG}" ]; then
            LOG=$(find /tmp -maxdepth 2 -name 'parako-install-*.log' 2>/dev/null | head -n1)
          fi
          test -n "${LOG}" || { echo "no install log found"; exit 1; }
          if grep -qE '(systemctl|pm2 |pg_dump|mongodump|certbot|nginx -t|apt-get install|apk add )' "${LOG}"; then
            echo "::error::install log contains a banned tool invocation" >&2
            grep -nE '(systemctl|pm2 |pg_dump|mongodump|certbot|nginx -t|apt-get install|apk add )' "${LOG}" >&2 || true
            exit 1
          fi
          echo "install log clean"
