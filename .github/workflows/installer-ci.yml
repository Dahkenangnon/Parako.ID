name: Installer CI

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'scripts/release.sh'
      - '.github/workflows/installer-ci.yml'
  pull_request:
    paths:
      - 'installer/**'
      - 'scripts/release.sh'
      - '.github/workflows/installer-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint shellcheck + bash -n + structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck + bats + checkbashisms
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bats devscripts

      - name: Syntax check bash -n
        run: |
          bash -n installer/install.sh
          bash -n installer/install-git.sh
          bash -n installer/parako.sh

      - name: ShellCheck warning level fatal
        run: |
          shellcheck -S warning installer/install.sh
          shellcheck -S warning installer/install-git.sh
          shellcheck -S warning installer/parako.sh

      - name: Checkbashisms informational
        continue-on-error: true
        run: |
          checkbashisms installer/install.sh || true
          checkbashisms installer/install-git.sh || true
          checkbashisms installer/parako.sh || true

      - name: Acceptance grep — low-level installer does not operate services or databases
        run: |
          set -euo pipefail
          # The installer must not invoke service / DB / proxy / package tooling.
          if grep -HnE '(^|[^[:alnum:]_-])(systemctl|pm2|pg_dump|mongodump|certbot|nginx -t)([[:space:]]|$)' \
               installer/install.sh \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
             | grep -vE '\bprintf .*' \
             | grep -vE 'printf [^|]*\((systemctl|pm2|docker)' \
             | grep -vE '"start / stop / restart"' \
             | grep -vE 'NOT (manage|invoke|configure|run|do)' ; then
            echo "::error::installer code contains a banned tool call (above)" >&2
            exit 1
          fi
          if grep -HnE '(apt-get install|yum install|apk add )' \
               installer/install.sh \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
             | grep -vE 'die ' \
             | grep -vE '_pf_(fail|warn|ok)' \
             | grep -vE 'log_(warn|err) ' \
             | grep -vE 'printf .*apk add' ; then
            echo "::error::installer code contains a package-manager install call (above)" >&2
            exit 1
          fi
          if grep -HnE 'pnpm (install|db:)' \
               installer/install.sh \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' \
             | grep -vE 'printf .*' ; then
            echo "::error::installer code contains pnpm install/db: invocation (above)" >&2
            exit 1
          fi
          echo "installer code is free of banned tool calls"

      - name: Structure bats — function/flag presence + absence assertions
        run: bats installer/test/structure.bats

  git-source:
    name: Git source lifecycle
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
      - name: Git installer lifecycle acceptance
        run: bats installer/test/git-installer.bats installer/test/operator-config.bats

  fixture:
    name: Build fixture tarball
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    outputs:
      fixture_version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@11 --activate
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Stage release tarball
        id: build
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          bash scripts/release.sh "$V" --verbose
          ls -la "parako-id-v${V}-linux-x64.tar.gz" SHA256SUMS
          echo "version=${V}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parako-fixture
          path: |
            parako-id-v*.tar.gz
            SHA256SUMS
          retention-days: 1

  smoke:
    name: Smoke ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: fixture
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:12
          - debian:13
    container:
      image: ${{ matrix.os }}
    env:
      OS_IMAGE: ${{ matrix.os }}
      FIX_VERSION: ${{ needs.fixture.outputs.fixture_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: parako-fixture
          path: ./fixture
      - name: Install prerequisites
        run: |
          case "$OS_IMAGE" in
            ubuntu:*|debian:*)
              apt-get update -qq
              apt-get install -y -qq bash bats curl ca-certificates openssl tar coreutils util-linux
              ;;
          esac
          bash --version | head -n1
          bats --version
          command -v flock

      - name: Smoke bats (argparse + --plan + --help)
        run: bats installer/test/smoke.bats

      - name: Fresh install from fixture
        shell: bash
        run: |
          set -euo pipefail
          FIX_TAR="$(pwd)/fixture/parako-id-v${FIX_VERSION}-linux-x64.tar.gz"
          FIX_SUMS="$(pwd)/fixture/SHA256SUMS"
          bash installer/install.sh \
            --dir /opt/parako-id \
            --version "${FIX_VERSION}" \
            --offline \
            --tarball "${FIX_TAR}" \
            --checksum "${FIX_SUMS}" \
            --insecure-no-signature --reason "ci fixture; no signed release exists yet" \
            --non-interactive --force \
            --no-bin
          test -L /opt/parako-id/current
          test -d /opt/parako-id/runtime/locales
          test -d /opt/parako-id/runtime/views
          # operator-owned: must NOT be created by installer
          test ! -f /opt/parako-id/runtime/.env
          test ! -d /opt/parako-id/runtime/jwks
          # release dir layout: current is absolute; per-release runtime is relative
          [[ "$(readlink /opt/parako-id/current)" == /opt/parako-id/releases/* ]]
          [[ "$(readlink "/opt/parako-id/releases/v${FIX_VERSION}/runtime")" == ../../runtime ]]

      - name: Doctor reports the install
        run: bash installer/install.sh --doctor --dir /opt/parako-id --no-color

      - name: --gc preview with --keep 1 (nothing to delete on single-release install)
        run: bash installer/install.sh --gc --dir /opt/parako-id --keep 1

      - name: Install log must NOT contain any service / DB / proxy / package call
        shell: bash
        run: |
          set -euo pipefail
          LOG=$(find /var/log -maxdepth 1 -name 'parako-install-*.log' 2>/dev/null | head -n1)
          if [ -z "${LOG}" ]; then
            LOG=$(find /tmp -maxdepth 2 -name 'parako-install-*.log' 2>/dev/null | head -n1)
          fi
          test -n "${LOG}" || { echo "no install log found"; exit 1; }
          if grep -qE '(systemctl|pm2 |pg_dump|mongodump|certbot|nginx -t|apt-get install|apk add )' "${LOG}"; then
            echo "::error::install log contains a banned tool invocation" >&2
            grep -nE '(systemctl|pm2 |pg_dump|mongodump|certbot|nginx -t|apt-get install|apk add )' "${LOG}" >&2 || true
            exit 1
          fi
          echo "install log clean"
