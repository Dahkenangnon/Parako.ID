version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: friday
    target-branch: dev
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps)'
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

    ignore:
      # Keep compiler tooling within the versions supported by the Node 24
      # runtime and typescript-eslint. Revisit these when the runtime moves.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # These majors require explicit compatibility or licensing work and
      # must not be mixed into routine grouped maintenance updates.
      - dependency-name: bullmq
        update-types:
          - version-update:semver-major
      - dependency-name: ioredis
        update-types:
          - version-update:semver-major
      - dependency-name: ua-parser-js
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: friday
    target-branch: dev
    open-pull-requests-limit: 5
