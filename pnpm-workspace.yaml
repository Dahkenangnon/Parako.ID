# pnpm 11 defaults strictDepBuilds=true and refuses to run install scripts for
# any package that isn't explicitly allow-listed below. Each entry has been
# reviewed: these are the native-binding deps the project relies on at runtime,
# during tests, or during local dev — and their install scripts are required
# for them to function. See https://pnpm.io/settings#allowbuilds for the schema.
allowBuilds:
  better-sqlite3: true # SQLite native bindings — used by data/parako.db
  argon2: true # Argon2 password hashing native bindings
  esbuild: true # Post-install fetches platform-specific binary
  mongodb-memory-server: true # Test infra; fetches mongod binary at install
  prisma: true # Generates Prisma client during postinstall
  '@prisma/client': true # Generates platform-specific query engine
  husky: true # Installs git hooks via the prepare script
  '@parcel/watcher': true # Native file-watcher used by dev-mode rebuilds
  '@prisma/engines': true # Downloads platform-specific Prisma engines
  '@swc/core': true # Native SWC bindings for fast TS transpile
  msgpackr-extract: true # Native msgpack codec for prisma-studio caching
  sharp: true # Native libvips bindings used for image variant generation

# Nunjucks 3's optional watcher peer is pinned to Chokidar 3, but its watch
# integration uses the stable watch() API and is smoke-tested with Chokidar 5.
peerDependencyRules:
  allowedVersions:
    'nunjucks>chokidar': '5'

minimumReleaseAgeExclude:
  - oidc-provider@9.9.1
  - '@xhmikosr/decompress@10.2.1'
  - form-data@4.0.6
  - hono@4.12.25
  - js-yaml@4.2.0
  - multer@2.2.0
  - nodemailer@9.0.3
  - piscina@4.9.3
  - undici@8.5.0
  - vite@8.1.5
  - '@aws-sdk/client-s3@3.1086.0'
  - '@aws-sdk/credential-provider-node@3.972.67'
  - '@aws-sdk/s3-request-presigner@3.1086.0'
  - '@types/supertest@7.2.1'
  - '@typescript-eslint/eslint-plugin@8.65.0'
  - '@typescript-eslint/parser@8.65.0'
  - '@typescript-eslint/project-service@8.65.0'
  - '@typescript-eslint/scope-manager@8.65.0'
  - '@typescript-eslint/tsconfig-utils@8.65.0'
  - '@typescript-eslint/type-utils@8.65.0'
  - '@typescript-eslint/types@8.65.0'
  - '@typescript-eslint/typescript-estree@8.65.0'
  - '@typescript-eslint/utils@8.65.0'
  - '@typescript-eslint/visitor-keys@8.65.0'
  - typescript-eslint@8.65.0
  - '@hono/node-server@2.0.10'
  - axios@1.18.0
  - body-parser@2.3.0
  - brace-expansion@5.0.8
  - fast-uri@3.1.5
  - mongoose@9.7.4
  - sharp@0.35.3
  - valibot@1.4.2

# Transitive vulnerability remediation — every entry maps a vulnerable package
# to its patched floor. Keep these constraints aligned with GitHub alerts and
# remove them once every parent dependency resolves a patched version itself.
overrides:
  vite: '>=8.1.5 <9'
  tmp: '>=0.2.4'
  glob@10: '>=10.5.0 <11'
  glob@11: '>=11.1.0 <12'
